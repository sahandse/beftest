name: Bootstrap Signed Release

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/bootstrap-signed-release.yml"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android scaffold
        run: flutter create . --platforms=android --org=ir.befrest --project-name=befrest

      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 37")
          s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 35")
          if "isCoreLibraryDesugaringEnabled = true" not in s:
              s = s.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )
          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          if dep not in s:
              s += '\n\ndependencies {\n    ' + dep + '\n}\n'
          p.write_text(s)
          PY

      - name: Generate persistent release keystore
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_PASS="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)"
          RELEASE_ALIAS="befrest"
          echo "::add-mask::$RELEASE_PASS"
          echo "RELEASE_PASS=$RELEASE_PASS" >> "$GITHUB_ENV"
          echo "RELEASE_ALIAS=$RELEASE_ALIAS" >> "$GITHUB_ENV"

          keytool -genkeypair -v             -keystore android/app/befrest-release.jks             -storepass "$RELEASE_PASS"             -keypass "$RELEASE_PASS"             -alias "$RELEASE_ALIAS"             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=Befrest,O=Befrest,C=CA"

      - name: Configure Gradle signing
        shell: bash
        run: |
          cat > android/key.properties <<EOF
          storePassword=$RELEASE_PASS
          keyPassword=$RELEASE_PASS
          keyAlias=$RELEASE_ALIAS
          storeFile=befrest-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          imports = """import java.util.Properties
          import java.io.FileInputStream

          """
          if not s.startswith("import java.util.Properties"):
              s = imports + s

          bootstrap = """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          if "val keystoreProperties = Properties()" not in s:
              s = s.replace("android {", bootstrap + "android {", 1)

          if "signingConfigs {" not in s:
              s = s.replace(
                  "    buildTypes {",
                  """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

              buildTypes {""",
                  1,
              )

          if 'signingConfig = signingConfigs.getByName("debug")' in s:
              s = s.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
          elif 'getByName("release") {' in s and 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace(
                  'getByName("release") {',
                  'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")',
                  1,
              )

          p.write_text(s)
          PY

      - name: Remove generated default test
        run: rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed APK
        run: flutter build apk --release

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Create signing kit
        shell: bash
        run: |
          mkdir -p signing-kit
          cp android/app/befrest-release.jks signing-kit/befrest-release.jks
          KEYSTORE_B64="$(base64 -w0 android/app/befrest-release.jks)"
          cat > signing-kit/GITHUB-SECRETS.txt <<EOF
          ANDROID_KEYSTORE_BASE64=$KEYSTORE_B64
          ANDROID_KEYSTORE_PASSWORD=$RELEASE_PASS
          ANDROID_KEY_ALIAS=$RELEASE_ALIAS
          ANDROID_KEY_PASSWORD=$RELEASE_PASS
          EOF
          keytool -list -v             -keystore android/app/befrest-release.jks             -storepass "$RELEASE_PASS"             -alias "$RELEASE_ALIAS" > signing-kit/CERTIFICATE-INFO.txt
          cat > signing-kit/KEEP-THIS-FILE.txt <<EOF
          This signing kit is required for every future Befrest update.
          Keep it private and backed up securely.
          Version: 1.1.0+101
          EOF
          zip -j befrest-signing-kit-1.1.0+101.zip signing-kit/*

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: befrest-1.1.0+101-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: befrest-1.1.0+101-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload signing kit
        uses: actions/upload-artifact@v4
        with:
          name: befrest-1.1.0+101-signing-kit
          path: befrest-signing-kit-1.1.0+101.zip
